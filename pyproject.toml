[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "object-snip"
version = "0.1.0"
description = "Select visual objects from frozen desktop screenshots"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = [
    "dbus-next>=0.2.3",
    "sam-2 @ git+https://github.com/facebookresearch/sam2.git@2b90b9f5ceec907a1c18123530e92e794ad901a4",
    "pyside6>=6.8",
    "tqdm>=4.67",
]

[project.scripts]
objectsnip = "objectsnip.__main__:main"

[dependency-groups]
dev = [
    "pillow>=11.0",
    "pyright>=1.1.400",
    "pytest>=8.3",
    "ruff>=0.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/objectsnip"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = [
    "integration: tests that require model weights or external runtime support",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
